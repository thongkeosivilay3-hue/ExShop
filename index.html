<!DOCTYPE html>

<html lang="lo">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport"/>
<script src="page-loader.js"></script>
<link rel="stylesheet" href="page-loader.css">
<title>ຮ້ານເກມອອນລາຍ</title>
<!-- style.css : ຮວມ CSS/ໂຕນສີ/ໄລເອົ້າທັງໝົດ -->
<link href="style.css?v=20261016b" rel="stylesheet"/>
<link href="page-transition.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&amp;family=Noto+Sans+Lao+Looped:wght@600;700;800&amp;family=Orbitron:wght@600;700;800;900&amp;family=Rajdhani:wght@500;600;700&amp;family=Lilita+One&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&amp;family=Noto+Sans+Lao+Looped:wght@600;700;800&amp;family=Orbitron:wght@600;700;800;900&amp;family=Rajdhani:wght@500;600;700&amp;family=Lilita+One&amp;display=swap" rel="stylesheet"/></noscript>

<link href="theme.css?v=20261016a" rel="stylesheet"/>
<link href="profile-fx.css?v=20261017d" rel="stylesheet"/>
<link href="bestsellers.css?v=1" rel="stylesheet"/>
<link href="fat-font.css?v=20261017a" rel="stylesheet"/>
</head>
<body class="is-home">
<div class="shell">
<!-- Header -->
<header>
<div class="brand">
<div class="logo has-custom-logo">
<img alt="logo" src="assets/logo.png"/>
</div>
<span class="brand-name en"></span>
</div>
<button class="login-btn" type="button">
<svg fill="currentColor" viewbox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.76-3.58-5-8-5Z"></path></svg>
<span>ລົງຊື່ເຂົ້າໃຊ້</span>
</button>
</header>
<!-- Hero -->
<section class="hero">
<span class="eyebrow"><svg class="eyebrow-icon" fill="currentColor" viewbox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"></path></svg> <span class="eyebrow-text"></span></span>
<h1 class="headline display-lo">ຍິນດີຕ້ອນຮັບສູ່ <span class="hl"></span></h1>
<p class="sub"></p>
<div class="cta-row">
<button class="btn btn-primary">
<svg fill="none" height="16" viewbox="0 0 24 24" width="16"><path d="M6 6h15l-1.5 9h-12L6 6Z" stroke="#fff" stroke-linejoin="round" stroke-width="1.8"></path><path d="M6 6L5 3H2" stroke="#fff" stroke-linecap="round" stroke-width="1.8"></path><circle cx="9" cy="20" fill="#fff" r="1.4"></circle><circle cx="17" cy="20" fill="#fff" r="1.4"></circle></svg>
        ເລີ່ມຕົ້ນໃຊ້ງານ
      </button>
<button class="btn btn-ghost">
        ວິທີໃຊ້ງານ
        <svg fill="none" height="15" viewbox="0 0 24 24" width="15"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
</button>
</div>
</section>
<!-- Promo banner placeholder -->
<div class="promo">
<svg fill="none" stroke="var(--text-faint)" stroke-width="1.4" viewbox="0 0 24 24"><rect height="15" rx="2" width="18" x="3" y="4"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="M21 15l-5-5-9 9"></path></svg>
<strong>ພື້ນທີ່ໃສ່ຮູບໂປຣໂມຊັ່ນ</strong>
<span>(ໃສ່ຮູບພາບຂອງທ່ານເອງບ່ອນນີ້ — ຂະໜາດແນະນຳ 1200×450px)</span>
</div>
<!-- Stats -->
<div class="stats">
<div class="stat-card">
<div class="stat-icon"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
<div><div class="stat-label">ຜູ້ໃຊ້ງານ</div><div class="stat-value">0<span class="unit">ຄົນ</span></div></div>
</div>
<div class="stat-card">
<div class="stat-icon"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M20 7L12 3 4 7l8 4 8-4Z"></path><path d="M4 7v10l8 4 8-4V7"></path><path d="M12 11v10"></path></svg></div>
<div><div class="stat-label">ສິນຄ້າ</div><div class="stat-value">0<span class="unit">ລາຍການ</span></div></div>
</div>
<div class="stat-card">
<div class="stat-icon"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><rect height="14" rx="2" width="18" x="3" y="7"></rect><path d="M3 11h18"></path><path d="M8 7V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3"></path></svg></div>
<div><div class="stat-label">ຄັງສິນຄ້າ</div><div class="stat-value">0<span class="unit">ຊິ້ນ</span></div></div>
</div>
<div class="stat-card">
<div class="stat-icon"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><path d="M22 4L12 14.01l-3-3"></path></svg></div>
<div><div class="stat-label">ຂາຍແລ້ວ</div><div class="stat-value">0<span class="unit">ຊິ້ນ</span></div></div>
</div>
</div>
<!-- Best sellers (ສິນຄ້າຂາຍດີ) — สร้างโดย bestsellers.js -->
<section class="section bs-section" id="bsSection" hidden>
<div class="bs-head">
<div class="bs-ico"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg></div>
<div class="bs-ttl">
<div class="bs-t">ຂາຍດີປະຈຳອາທິດ</div>
<div class="bs-s">ສິນຄ້າຂາຍດີທີ່ລູກຄ້າເລືອກຫຼາຍທີ່ສຸດ</div>
</div>
<a class="bs-all" href="#categories">ເບິ່ງທັງໝົດ</a>
</div>
<div class="bs-wrap">
<div class="bs-track" id="bsTrack"></div>
<button aria-label="ກ່ອນໜ້າ" class="bs-nav bs-prev" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button aria-label="ຖັດໄປ" class="bs-nav bs-next" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</section>
<!-- Recent purchases (ซ่อนตอนเปิดโหมดแจ้งเตือนเลื่อน — คุมโดย purchase-toast.js) -->
<section class="section" id="rpSection" hidden>
<div class="section-title">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M20 7L12 3 4 7l8 4 8-4Z"></path><path d="M4 7v10l8 4 8-4V7"></path></svg>
      ສິນຄ້າທີ່ຊື້ລ່າສຸດ
    </div>
<div class="en u-caption-faint">Recent Purchases</div>
<!-- ແຖບ carousel ຖືກສ້າງ/ອັບເດດໂດຍ recent-purchases.js ຈາກຂໍ້ມູນຈິງ
         (GET /api/public/recent-purchases) — ຖ້າຍັງບໍ່ມີການສັ່ງຊື້ຈິງເລີຍ ທັງ section ນີ້ຈະຖືກເຊື່ອງ -->
<div class="rp-carousel u-hidden" id="rpCarousel">
<div class="rp-track" id="rpTrack"></div>
</div>
</section>
<!-- Categories -->
<section class="section" id="categories">
<div class="section-title u-mb-16">
<svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="m20.59 13.41-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"></path><circle cx="7" cy="7" r="1"></circle></svg>
      ໝວດໝູ່ແນະນຳ
    </div>
<!-- ກາຕູນໝວດໝູ່ 4 ອັນຖືກສ້າງອັດຕະໂນມັດໂດຍ storefront.js ຈາກຂໍ້ມູນຈິງ
         (ຊື່/ຮູບພາບ ດຶງມາຈາກການຕັ້ງຄ່າຮ້ານ, ຈຳນວນສິນຄ້າ/ສະຕັອກ ດຶງມາຈາກ Supabase ຈິງ)
         ຖ້າແອດມິນຍັງບໍ່ໄດ້ຕັ້ງຊື່/ຮູບ ຈະໂຊວ໌ຄ່າເລີ່ມຕົ້ນ/placeholder ຄືເກົ່າ -->
<div class="cat-stack" id="cat-stack"></div>
</section>
<!-- Footer -->
<footer>
<div class="footer-logo logo"></div>
<div class="fname en"></div>
<div class="fsocial" id="footer-social"></div>
<div class="fcopy">© 2026 <span class="fcopy-name en"></span> . ຄວາມເປັນສ່ວນຕົວ</div>
<a class="u-hidden u-fine-print" href="admin.html" id="admin-link">Admin</a>
</footer>
<!-- Chat FAB -->
<button aria-label="Chat" class="chat-fab">
<svg fill="none" viewbox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg>
</button>
</div>
<!-- storefront-data.js  : ດຶງຂໍ້ມູນຮ້ານຈິງ (ໝວດໝູ່/ສິນຄ້າ/ສະຕັອກ) ຈາກ /api/public/storefront
     storefront.js       : ສ້າງກາຕູນໝວດໝູ່ + ອັບເດດສະຖິຕິ "ສິນຄ້າ"/"ຄັງສິນຄ້າ" ຈາກຂໍ້ມູນຈິງ
     recent-purchases.js : ແຖບ "ສິນຄ້າທີ່ຊື້ລ່າສຸດ" ໄຫຼອັດຕະໂນມັດຂວາ->ຊ້າຍແບບວົນຕໍ່ເນື່ອງ
                            ດຶງຂໍ້ມູນຈິງຈາກ /api/public/recent-purchases
     promo-popup.js      : popup ໂປຣໂມຊັ່ນ ໂຊວ໌ຕອນເປີດໜ້າຫຼັກ (ຮູບ/ເປີດ-ປິດ ຕັ້ງຄ່າຈາກຫ້ອງແອດມິນ)
     script.js           : ການເຮັດວຽກ interactive ອື່ນໆຂອງໜ້າ (login state, chat fab, ...) -->
<script src="page-transition.js"></script>
<script src="storefront-data.js"></script>
<script src="storefront.js?v=20261017e"></script>
<script src="bestsellers.js?v=1"></script>
<script src="recent-purchases.js"></script>
<script src="purchase-toast.js?v=20261017a"></script>
<script src="promo-popup.js"></script>
<script src="script.js?v=20261017a"></script>

<script src="theme.js?v=20261016a"></script>
<script src="stat-bg.js?v=20261016a"></script>
</body>
</html>
