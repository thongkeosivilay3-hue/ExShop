<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ເຂົ້າສູ່ລະບົບ</title>
<!-- ໜ້ານີ້ເຫຼືອໄວ້ເພື່ອໃຫ້ລິ້ງເກົ່າ (/login.html?next=...) ຍັງໃຊ້ໄດ້ — ສົ່ງຕໍ່ໄປເປີດ modal ທີ່ໜ້າຫຼັກ -->
<script>
(function(){
  var p=new URLSearchParams(location.search), q=new URLSearchParams();
  q.set('auth','login');
  var n=p.get('next'); if(n) q.set('next',n);
  location.replace('/index.html?'+q.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=index.html"></noscript>
</head>
<body></body>
</html>
